baseURL: /
languageCode: 'en-us'
title: 'go-tui'
copyright: "© 2026 nfx"

enableRobotsTXT: true
enableGitInfo: true

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true

enableInlineShortcodes: true

outputFormats:
  llms:
    baseName: llms
    mediaType: text/plain
    isPlainText: true
    notAlternative: true
  llmsfull:
    baseName: llms-full
    mediaType: text/plain
    isPlainText: true
    notAlternative: true

outputs:
  home:
    - html
    - llms
    - llmsfull

menu:
  main:
    - identifier: documentation
      name: Documentation
      pageRef: getting-started
      weight: 1
    - name: Search
      weight: 5
      params:
        type: search
    - name: GitHub
      weight: 6
      url: "https://github.com/nfx/go-tui"
      params:
        icon: github

services:
  googleAnalytics:
    id: G-VH404N29H1

params:
  description: "Add interactivity to Go CLIs without changing their architecture: typed prompts, coordinated progress and logs, and non-TTY defaults for automation."
  keywords: "tui, terminal, go, golang, dropdown, spinner, progress bar"
  sourceURL: "https://github.com/nfx/go-tui/blob/main"
  copyright: "© 2026 nfx"

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.svg
      dark: images/logo-dark.svg
    width: wide

  page:
    width: normal
    tabs:
      sync: true

  theme:
    default: system
    displayToggle: true

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: false
    width: normal

  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward

  editURL:
    enable: true
    base: "https://github.com/nfx/go-tui/edit/main/site/content"

  highlight:
    copy:
      enable: true
      display: always
